[project]
name = "straight-classroom"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "bcrypt>=5.0.0",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "httpx2>=2.12.0",
    "minio>=7.2.0",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.14.0",
    "pytest>=9.1.1",
    "sqlmodel>=0.0.42",
]

[dependency-groups]
dev = [
    "ruff>=0.16.7",
]

[tool.ruff.lint]
ignore = ["B008"]
