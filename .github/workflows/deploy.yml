name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    # A manual run from another branch must not reach the server.
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  images:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image names must be lowercase; the repo path may not be.
      - id: names
        run: |
          prefix="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          echo "backend=${prefix}/backend" >> "$GITHUB_OUTPUT"
          echo "frontend=${prefix}/frontend" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ steps.names.outputs.backend }}:latest
            ${{ steps.names.outputs.backend }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ steps.names.outputs.frontend }}:latest
            ${{ steps.names.outputs.frontend }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

    outputs:
      backend: ${{ steps.names.outputs.backend }}
      frontend: ${{ steps.names.outputs.frontend }}

  deploy:
    needs: images
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PATH: ${{ secrets.VPS_PATH }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          cat > ~/.ssh/config <<CONFIG
          Host vps
            HostName ${VPS_HOST}
            User ${VPS_USER}
            Port ${{ secrets.VPS_PORT || 22 }}
            IdentityFile ~/.ssh/id_deploy
            StrictHostKeyChecking accept-new
          CONFIG

      # The VPS keeps its own .env (secrets); only the compose file is shipped.
      - name: Upload compose file
        run: scp docker-compose.yml "vps:${VPS_PATH}/docker-compose.yml"

      - name: Pull and restart
        env:
          BACKEND_IMAGE: ${{ needs.images.outputs.backend }}:${{ github.sha }}
          FRONTEND_IMAGE: ${{ needs.images.outputs.frontend }}:${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The token goes over stdin so it never lands in a command line.
          echo "$GHCR_TOKEN" | ssh vps "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          ssh vps "cd '$VPS_PATH' \
            && export BACKEND_IMAGE='$BACKEND_IMAGE' FRONTEND_IMAGE='$FRONTEND_IMAGE' \
            && docker compose pull backend frontend \
            && docker compose up -d --remove-orphans \
            && docker image prune -f"
